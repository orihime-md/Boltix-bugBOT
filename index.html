<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BOLTIX — Crash Bug Terminal</title>

<!-- Modern type stack -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     DESIGN TOKENS
  ============================================================ */
  :root {
    /* Palette */
    --bg-0:        #060609;
    --bg-1:        #0b0b12;
    --surface:     rgba(255, 255, 255, 0.035);
    --surface-2:   rgba(255, 255, 255, 0.06);
    --stroke:      rgba(255, 255, 255, 0.09);
    --stroke-soft: rgba(255, 255, 255, 0.05);

    --text-1:      #f4f4f8;
    --text-2:      #a3a3b8;
    --text-3:      #62627a;

    --accent:      #7c5cff;
    --accent-2:    #4dd8ff;
    --accent-hot:  #ff4d8d;

    --ok:          #34d399;
    --ok-bg:       rgba(52, 211, 153, 0.10);
    --ok-stroke:   rgba(52, 211, 153, 0.25);

    --warn:        #fbbf24;
    --warn-bg:     rgba(251, 191, 36, 0.10);
    --warn-stroke: rgba(251, 191, 36, 0.25);

    --err:         #fb7185;
    --err-bg:      rgba(251, 113, 133, 0.10);
    --err-stroke:  rgba(251, 113, 133, 0.30);

    --info:        #60a5fa;
    --info-bg:     rgba(96, 165, 250, 0.10);
    --info-stroke: rgba(96, 165, 250, 0.25);

    /* Type */
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', 'SF Mono', monospace;

    /* Radii */
    --r-lg: 24px;
    --r-md: 14px;
    --r-sm: 10px;

    /* Motion */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ============================================================
     RESET
  ============================================================ */
  *, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    color: var(--text-1);
    background: var(--bg-0);
    padding: clamp(16px, 4vw, 40px);
    overflow-x: hidden;
    position: relative;
  }

  /* ============================================================
     AURORA BACKGROUND — layered mesh gradients + grain
  ============================================================ */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: -2;
    filter: blur(90px);
    opacity: 0.55;
    pointer-events: none;
  }
  .aurora::before,
  .aurora::after {
    content: '';
    position: absolute;
    width: 55vmax; height: 55vmax;
    border-radius: 50%;
  }
  .aurora::before {
    background: radial-gradient(circle at 30% 30%, var(--accent), transparent 65%);
    top: -10%; left: -8%;
    animation: drift-a 26s ease-in-out infinite alternate;
  }
  .aurora::after {
    background: radial-gradient(circle at 70% 70%, var(--accent-2), transparent 60%);
    bottom: -12%; right: -10%;
    animation: drift-b 32s ease-in-out infinite alternate;
  }

  @keyframes drift-a { to { transform: translate(6%, 10%) scale(1.15); } }
  @keyframes drift-b { to { transform: translate(-8%, -6%) scale(1.1); } }

  .grain {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }

  /* ============================================================
     CARD — glassmorphism shell
  ============================================================ */
  .card {
    position: relative;
    width: min(100%, 460px);
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015) 40%, rgba(255,255,255,0.04));
    border: 1px solid var(--stroke);
    border-radius: var(--r-lg);
    padding: clamp(28px, 5vw, 40px);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    box-shadow:
      0 24px 80px rgba(0, 0, 0, 0.55),
      0 2px 8px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center;
    animation: card-in 0.7s var(--ease-out) both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  /* Top gradient hairline */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(124, 92, 255, 0.6), transparent);
  }

  /* ============================================================
     HEADER
  ============================================================ */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .brand-mark {
    width: 40px; height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hot));
    box-shadow:
      0 4px 16px rgba(124, 92, 255, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    font-size: 20px;
    position: relative;
    flex-shrink: 0;
  }
  /* Electric shimmer sweep across the mark */
  .brand-mark::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
    background-size: 250% 100%;
    animation: shimmer 3.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 15%  { background-position: 180% 0; }
    50%, 100% { background-position: -80% 0; }
  }

  .brand-text { text-align: left; }

  h1 {
    font-size: clamp(1.3rem, 4vw, 1.55rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.1;
    background: linear-gradient(120deg, #fff 30%, #c9c2ff 70%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-version {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-3);
  }

  .sub {
    color: var(--text-2);
    font-size: 0.86rem;
    font-weight: 400;
    margin-bottom: 22px;
    letter-spacing: 0.01em;
  }

  /* ============================================================
     STATUS PILL — animated state indicator
  ============================================================ */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 18px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn-stroke);
    margin-bottom: 26px;
    transition: background 0.4s, color 0.4s, border-color 0.4s;
  }

  .status .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    position: relative;
    flex-shrink: 0;
  }
  .status .dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: currentColor;
    animation: ping 1.6s ease-out infinite;
  }
  @keyframes ping {
    0%   { transform: scale(1);   opacity: 0.7; }
    80%, 100% { transform: scale(2.6); opacity: 0; }
  }

  .status.on {
    background: var(--ok-bg); color: var(--ok); border-color: var(--ok-stroke);
  }
  .status.on .dot::after { animation: none; }

  .status.connecting {
    background: var(--info-bg); color: var(--info); border-color: var(--info-stroke);
  }
  .status.reconnecting {
    background: var(--warn-bg); color: var(--warn); border-color: var(--warn-stroke);
  }
  .status.disconnected,
  .status.pairfailed {
    background: var(--err-bg); color: var(--err); border-color: var(--err-stroke);
  }

  /* ============================================================
     QR STAGE
  ============================================================ */
  .stage {
    width: min(280px, 100%);
    aspect-ratio: 1;
    margin: 0 auto 26px;
    position: relative;
    border-radius: var(--r-lg);
    overflow: hidden;
  }

  #qr {
    width: 100%; height: 100%;
    display: none;
    border-radius: var(--r-lg);
    background: #fff;
    padding: 12px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    animation: card-in 0.5s var(--ease-out) both;
  }

  #ov {
    width: 100%; height: 100%;
    display: grid;
    place-items: center;
    font-size: 3rem;
    background:
      radial-gradient(circle at 50% 40%, rgba(124, 92, 255, 0.12), transparent 70%),
      var(--bg-1);
    border-radius: var(--r-lg);
    border: 1px dashed var(--stroke);
    position: relative;
  }
  #ov::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(124,92,255,0.10), transparent 60%);
    animation: breath 3s ease-in-out infinite;
  }
  @keyframes breath {
    0%, 100% { opacity: 0.4; transform: scale(0.92); }
    50%      { opacity: 1;   transform: scale(1.05); }
  }

  /* Scan-line sweep while waiting for QR */
  .stage .scanning {
    position: absolute;
    left: 8%; right: 8%;
    height: 2px;
    top: 12px;
    background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
    border-radius: 2px;
    box-shadow: 0 0 16px var(--accent-2);
    opacity: 0;
    pointer-events: none;
  }
  .stage.waiting .scanning { opacity: 1; animation: scan 2.4s ease-in-out infinite; }
  @keyframes scan {
    0%, 100% { top: 12%; }
    50%      { top: 86%; }
  }

  /* ============================================================
     DIVIDER
  ============================================================ */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 4px 0 22px;
    color: var(--text-3);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--stroke), transparent);
  }

  /* ============================================================
     PAIRING FORM
  ============================================================ */
  form { display: flex; gap: 10px; }

  .field {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }

  .field::before {
    content: '+';
    position: absolute;
    left: 14px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-3);
    pointer-events: none;
    transition: color 0.3s;
  }

  input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--stroke);
    color: var(--text-1);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 14px 14px 14px 34px;
    border-radius: var(--r-sm);
    outline: none;
    transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
  }
  input::placeholder {
    color: var(--text-3);
    font-family: var(--font-display);
    font-weight: 400;
    letter-spacing: 0;
  }
  input:hover { border-color: rgba(255,255,255,0.16); }
  input:focus {
    border-color: var(--accent);
    background: var(--surface-2);
    box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15);
  }
  .field:focus-within::before { color: var(--accent); }

  button {
    position: relative;
    background: linear-gradient(135deg, var(--accent), #5b46d8);
    color: #fff;
    border: none;
    padding: 14px 22px;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    white-space: nowrap;
    box-shadow: 0 4px 18px rgba(124, 92, 255, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: transform 0.2s var(--ease-spring), box-shadow 0.2s, filter 0.2s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgba(124, 92, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    filter: brightness(1.1);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.45; cursor: wait; }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  /* ============================================================
     RESULT / ERROR
  ============================================================ */
  #code {
    margin-top: 20px;
    display: none;
    font-family: var(--font-mono);
    font-size: clamp(1.5rem, 5vw, 1.9rem);
    font-weight: 700;
    letter-spacing: 0.4em;
    color: var(--ok);
    text-shadow: 0 0 24px rgba(52, 211, 153, 0.4);
    background: var(--ok-bg);
    border: 1px solid var(--ok-stroke);
    border-radius: var(--r-md);
    padding: 18px 10px 18px calc(10px + 0.4em); /* balance letter-spacing */
    animation: code-pop 0.5s var(--ease-spring) both;
    cursor: pointer;
    transition: filter 0.2s;
  }
  #code:hover { filter: brightness(1.2); }
  #code .copy-hint {
    display: block;
    font-family: var(--font-display);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(52, 211, 153, 0.55);
    margin-top: 8px;
  }
  @keyframes code-pop {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  #err {
    margin-top: 14px;
    color: var(--err);
    font-size: 0.82rem;
    font-weight: 500;
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    animation: err-in 0.3s ease both;
  }
  @keyframes err-in { from { opacity: 0; transform: translateY(-4px); } }

  /* ============================================================
     FOOTER HINT
  ============================================================ */
  .hint {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--stroke-soft);
    color: var(--text-3);
    font-size: 0.72rem;
    line-height: 1.7;
    letter-spacing: 0.02em;
  }
  .hint kbd {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    background: var(--surface-2);
    border: 1px solid var(--stroke);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    color: var(--text-2);
  }

  /* ============================================================
     MOTION SAFETY
  ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ============================================================
     MOBILE
  ============================================================ */
  @media (max-width: 480px) {
    .card { padding: 24px 20px; }
    form { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>

  <div class="aurora"></div>
  <div class="grain"></div>

  <main class="card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">⚡</div>
      <div class="brand-text">
        <h1>BOLTIX</h1>
        <span class="brand-version">Crash Bug Terminal</span>
      </div>
    </div>

    <p class="sub">Link your WhatsApp to activate the bot</p>

    <span class="status" id="status"><span class="dot"></span><span id="status-text">starting…</span></span>

    <div class="stage" id="stage">
      <div class="scanning"></div>
      <div id="ov">💀</div>
      <img id="qr" alt="WhatsApp QR code" />
    </div>

    <div class="divider">or link by number</div>

    <form id="form">
      <div class="field">
        <input
          id="phone"
          placeholder="e.g. 2348123456789"
          inputmode="numeric"
          autocomplete="tel"
          aria-label="Phone number for pairing" />
      </div>
      <button id="btn" type="submit">Get code</button>
    </form>

    <div id="code" title="Click to copy"></div>
    <div id="err" role="alert"></div>

    <footer class="hint">
      Open WhatsApp → <kbd>Settings</kbd> → <kbd>Linked devices</kbd> →<br />
      <kbd>Link with phone number</kbd> and enter the code above.
    </footer>
  </main>

<script>
  const $ = id => document.getElementById(id);
  let polling = false;
  let haveQr = false;

  // Status text lives in a separate span so the animated dot persists
  // across state changes.
  function setStatus(cls, text) {
    const s = $('status');
    s.className = 'status' + (cls ? ' ' + cls : '');
    $('status-text').textContent = text;
  }

  // Stage helpers: QR shown / skeleton shown-with-scanline
  function showQr(dataUrl) {
    haveQr = true;
    $('stage').classList.remove('waiting');
    $('qr').src = dataUrl;
    $('qr').style.display = 'block';
    $('ov').style.display = 'none';
  }
  function showSkeleton(char) {
    haveQr = false;
    $('stage').classList.add('waiting');
    $('qr').style.display = 'none';
    $('ov').style.display = 'grid';
    $('ov').textContent = char || '💀';
  }

  function clearPairingUi() {
    $('code').style.display = 'none';
    $('code').textContent = '';
    $('err').textContent = '';
  }

  function showConnected(user) {
    setStatus('on', 'connected' + (user ? ' · ' + user : ''));
    $('stage').classList.remove('waiting');
    $('qr').style.display = 'none';
    $('ov').style.display = 'grid';
    $('ov').textContent = '✅';
    if (haveQr) clearPairingUi();
    haveQr = false;
  }

  // Non-overlapping poll: next run only starts after the previous
  // completes, so slow responses can't stack.
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const state = await (await fetch('/api/state')).json();

      switch (state.state) {
        case 'connected':     showConnected(state.user); break;
        case 'waiting_qr':    setStatus('reconnecting', 'waiting for scan'); break;
        case 'connecting':    setStatus('connecting', 'connecting…'); break;
        case 'reconnecting':  setStatus('reconnecting', 'reconnecting…'); break;
        case 'disconnected':  setStatus('disconnected', 'disconnected'); break;
        default:               setStatus('connecting', 'starting…');
      }

      if (!state.connected) {
        const { qr } = await (await fetch('/api/qr')).json();
        if (qr) {
          showQr(qr);
          if (state.state !== 'connected') setStatus('reconnecting', 'waiting for scan');
        } else {
          showSkeleton();
          if (state.state === 'waiting_qr' || state.state === 'connecting')
            setStatus(state.state === 'waiting_qr' ? 'reconnecting' : 'connecting',
                      state.state === 'waiting_qr' ? 'generating QR…' : 'connecting…');
        }
      }
    } catch (_) {
      setStatus('pairfailed', 'connection error');
    } finally {
      polling = false;
    }
  }

  (function loop() {
    poll().finally(() => setTimeout(loop, 3000));
  })();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('btn');
    btn.disabled = true;
    $('err').textContent = '';
    $('code').style.display = 'none';
    try {
      const res = await fetch('/api/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ number: $('phone').value })
      });
      const data = await res.json();
      if (!res.ok) {
        $('err').textContent = '⚠ ' + (data.error || 'Pairing failed');
        setStatus('pairfailed', 'pairing failed');
      } else {
        const codeEl = $('code');
        codeEl.innerHTML = '';
        codeEl.append(data.code);
        const hint = document.createElement('span');
        hint.className = 'copy-hint';
        hint.textContent = 'click to copy';
        codeEl.append(hint);
        codeEl.style.display = 'block';
        setStatus('connecting', 'pairing · enter code');
      }
    } catch {
      $('err').textContent = '⚠ Network error';
      setStatus('pairfailed', 'network error');
    } finally {
      btn.disabled = false;
    }
  });

  // Click-to-copy pairing code
  $('code').addEventListener('click', async () => {
    const text = $('code').firstChild?.textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      const hint = $('code').querySelector('.copy-hint');
      if (hint) { hint.textContent = 'copied ✓'; setTimeout(() => hint.textContent = 'click to copy', 1600); }
    } catch (_) {}
  });
</script>
</body>
</html>
